name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o sima ./cmd/sima

      - name: Smoke version
        run: ./sima version

      - name: Smoke setup, doctor, and lint
        run: |
          set -euo pipefail
          project="$(mktemp -d)"
          ./sima setup --path "$project" --backend none
          ./sima backend add echo-safe --kind codex --executable /bin/echo --path "$project"
          ./sima doctor "$project"
          ./sima lint "$project"
